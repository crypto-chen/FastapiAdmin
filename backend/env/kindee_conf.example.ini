; 金蝶云星空 WebAPI 连接配置模板
; 复制为 kindee_conf.ini 后填入真实值（该文件已被 .gitignore 排除，禁止提交）
[config]
; 账套 ID
X-KDApi-AcctID = <your_acct_id>
; 第三方系统登录授权的用户
X-KDApi-UserName = <your_username>
; 应用 ID
X-KDApi-AppID = <your_app_id>
; 应用密钥（仅本地保存，禁止提交到仓库）
X-KDApi-AppSec = <your_app_secret>
; 请求的产品环境地址，如果为公有云则无需填写
X-KDApi-ServerUrl = <your_server_url>
; 语言标识，2052 为简体中文
X-KDApi-LCID = 2052
; 组织编码，启用多组织时配置对应的组织编码才有效
; X-KDApi-OrgNum = 100
; 允许的最大连接延时，单位为秒
X-KDApi-ConnectTimeout = 360
; 允许的最大读取延时，单位为秒
X-KDApi-RequestTimeout = 360
